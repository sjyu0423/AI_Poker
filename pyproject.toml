[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pokermind"
version = "0.0.1"
description = "Local-first poker AI research and training: adaptive, exploitation-robust agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
neural = ["torch>=2.4"]
crosscheck = ["open_spiel>=1.5"]  # optional OpenSpiel oracle, see tests/test_openspiel_crosscheck.py
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "matplotlib>=3.8", "torch>=2.4"]

[project.scripts]
pokermind = "pokermind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
# Math notation in docstrings and plot labels (σ strategy, α Kuhn parameter, − minus).
allowed-confusables = ["σ", "α", "−"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Optional, untyped cross-check dependency (tests/test_openspiel_crosscheck.py).
module = ["open_spiel.*", "pyspiel"]
ignore_missing_imports = true
